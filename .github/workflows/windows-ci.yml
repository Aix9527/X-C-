name: Hosted Windows CI (optional)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Verify, test, build and publish
        shell: pwsh
        run: ./scripts/verify-win.ps1 -OutputDirectory "${{ github.workspace }}\artifacts\win-x64"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: X-C盘巡检官-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
