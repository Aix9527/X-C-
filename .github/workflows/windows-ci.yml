name: Windows CI

on:
  push:
    branches:
      - main
      - feat/xdiskinspector-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore XDiskInspector.sln

      - name: Test
        run: dotnet test tests/XDiskInspector.Tests/XDiskInspector.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Build WPF app
        run: dotnet build src/XDiskInspector.App/XDiskInspector.App.csproj -c Release --no-restore

      - name: Publish single-file win-x64
        shell: pwsh
        run: ./scripts/publish-win-x64.ps1 -OutputDirectory "${{ github.workspace }}\\artifacts\\win-x64"

      - name: Verify published EXE
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem "${{ github.workspace }}\\artifacts\\win-x64" -Recurse -Filter XDiskInspector.App.exe)
          if ($exe.Count -ne 1) {
            throw "Expected exactly one XDiskInspector.App.exe, found $($exe.Count)."
          }
          Write-Host "Verified: $($exe[0].FullName) ($($exe[0].Length) bytes)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: X-C盘巡检官-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
